<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Packs | Abdullah's Store</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{

height:100vh;
background:#000;
color:white;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;

}



/* Background Glow */


.circle{

position:absolute;
width:400px;
height:400px;
border-radius:50%;
background:linear-gradient(45deg,#00ffff,#8b5cf6);
filter:blur(120px);
opacity:.4;
animation:move 6s infinite alternate;

}


@keyframes move{

from{
transform:translate(-200px,-100px);
}

to{
transform:translate(200px,100px);
}

}





.container{

text-align:center;
z-index:10;
padding:40px;

background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
backdrop-filter:blur(20px);

border-radius:30px;

}



.logo{

width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:2px solid white;
margin:auto;

}





h1{

font-size:60px;
font-weight:800;
margin-top:30px;

background:linear-gradient(90deg,#fff,#aaa);

-webkit-background-clip:text;
color:transparent;

}




p{

color:#aaa;
font-size:18px;
margin-top:15px;

}





.loader{

display:flex;
justify-content:center;
gap:10px;
margin-top:35px;

}



.loader span{

width:15px;
height:15px;

background:white;
border-radius:50%;

animation:bounce 1.4s infinite;

}



.loader span:nth-child(2){

animation-delay:.2s;

}


.loader span:nth-child(3){

animation-delay:.4s;

}



@keyframes bounce{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-20px);

}

}





.back{

display:inline-block;
margin-top:40px;

padding:12px 30px;

background:white;
color:black;

border-radius:15px;

font-weight:600;

transition:.3s;

}



.back:hover{

transform:scale(1.08);

}



.count{

margin-top:25px;
font-size:22px;
font-weight:700;

}



</style>


</head>



<body>



<div class="circle"></div>



<div class="container">


<img src="assets/images/logo.png" class="logo">



<h1>
Coming Soon
</h1>


<p>
Premium Packs Collection is under development.
<br>
Stay tuned for amazing digital resources 🚀
</p>



<div class="loader">

<span></span>
<span></span>
<span></span>

</div>



<div class="count">

<span id="number">3</span>

</div>



<a href="index.html" class="back">

Back To Home

</a>



</div>





<script>


let num = 3;

let counter = document.getElementById("number");


setInterval(()=>{


num++;


if(num > 99){

num = 3;

}


counter.innerHTML = num;



},1000);



</script>



</body>

</html>
